[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**, .next/**, src/**"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_ADMIN_EMAIL,NEXT_PUBLIC_ADMIN_PASSWORD,ADMIN_EMAIL,ADMIN_PASSWORD,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_ENABLE_FIREBASE_STORAGE,CONTACT_EMAIL,NEXT_PUBLIC_CONTACT_EMAIL"
